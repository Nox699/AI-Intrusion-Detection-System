[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yggdrasil-ids"
version = "0.2.0"
description = "Private Linux IDS with SSH rules and Isolation Forest, sudo and portscan rules, and a Danish dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "Flask>=3.1.3,<3.2",
  "gunicorn>=25.1,<26",
  "numpy>=2.0,<3",
  "scikit-learn>=1.8,<1.9",
  "plotly>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
yggdrasil-ids = "yggdrasil_ids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yggdrasil_ids = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
