name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps --editable .
      - name: Lint production code, deployment and tests
        run: python -m ruff check src tests deploy
      - name: Check formatting
        run: python -m ruff format --check src tests deploy
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q src deploy
          bash -n deploy/*.sh
      - name: Run production tests
        run: python -m pytest --junitxml=test-results/pytest.xml
      - name: Test navigation seen markers
        run: node --test tests/nav_alerts.test.cjs
      - name: Build production wheel
        run: python -m build --wheel --no-isolation
