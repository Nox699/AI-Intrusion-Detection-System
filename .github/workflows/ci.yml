name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies and editable package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Validate safe Pi deployment scripts syntax
        run: bash -n deploy/sprint3_prepare.sh deploy/sprint3_upgrade.sh deploy/sprint3_resume_after_permissions.sh deploy/sprint3_enable_network.sh deploy/sprint3_charts_prepare.sh deploy/sprint3_charts_deploy.sh

      - name: Verify scan observation helper syntax
        run: python -m py_compile deploy/sprint3_network_observe.py

      - name: Validate threshold tuning script syntax
        run: bash -n deploy/sprint3_tune_threshold5.sh

      - name: Validate Sprint 4 isolated ML tooling
        run: |
          bash -n deploy/sprint4_run_synthetic_lab.sh deploy/sprint4_ml_demo_dashboard.sh
          python -m py_compile deploy/sprint4_ml_readiness.py deploy/sprint4_verify_lab.py deploy/sprint4_ssh_journal_history.py

      - name: Lint
        run: python -m ruff check src tests deploy/sprint4_ml_readiness.py deploy/sprint4_verify_lab.py deploy/sprint4_ssh_journal_history.py

      - name: Check formatting
        run: python -m ruff format --check src tests deploy/sprint4_ml_readiness.py deploy/sprint4_verify_lab.py deploy/sprint4_ssh_journal_history.py

      - name: Run tests
        run: python -m pytest --junitxml=test-results/pytest.xml

      - name: Build wheel
        run: python -m build --wheel --no-isolation
